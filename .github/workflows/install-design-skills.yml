name: Install project design skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-design-skills.yml'
      - 'scripts/install-design-skills.sh'
      - 'scripts/install-design-skills.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install selected design skills for Claude Code and Codex
        run: bash scripts/install-design-skills.sh

      - name: Show generated skill paths
        run: git status --short

      - name: Commit project-level skills
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No skill changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install project design skills for Claude Code and Codex"
          git pull --rebase origin main
          git push
