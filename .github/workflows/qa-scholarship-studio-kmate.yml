name: QA KMate Scholarship Studio Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-scholarship-studio-kmate.yml'
      - 'scholarship-studio-kmate/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          npm install --no-save --no-package-lock --no-audit playwright@1.56.1
          npx playwright install chromium
      - name: Exercise complete preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/scholarship-studio-kmate.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const url='http://127.0.0.1:8765/scholarship-studio-kmate/';
            for(const [width,height,label] of [[1440,900,'desktop'],[390,844,'mobile']]){
              const p=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const errors=[]; p.on('pageerror',e=>errors.push(e.message));
              await p.goto(url,{waitUntil:'networkidle'});
              if(await p.locator('.hero').count()!==1)throw Error(label+' hero missing');
              if(await p.locator('.subnav [data-view]').count()!==4)throw Error(label+' Studio nav missing');
              const awardCount=await p.locator('.award').count();
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth);
              const stored=await p.evaluate(()=>localStorage.getItem('kmate-scholarship-studio-preview-v3'));
              console.log(JSON.stringify({label,awardCount,overflow,errors,stored}));
              if(errors.length)throw Error(label+' page errors: '+errors.join(' | '));
              if(awardCount!==15)throw Error(label+' expected 15 awards, got '+awardCount);
              if(overflow)throw Error(label+' horizontal overflow');
              const heroBg=await p.locator('.hero').evaluate(el=>getComputedStyle(el).backgroundColor);
              if(heroBg==='rgb(10, 10, 10)'||heroBg==='rgb(18, 20, 28)')throw Error('dark hero regression');
              const second=p.locator('[data-hero-uni]').nth(1);
              await second.hover();
              if((await p.locator('#signal-name').innerText()).trim()!==(await second.locator('b').innerText()).trim())throw Error('hero live signal failed');

              if(label==='desktop'){
                // Eligibility profile + explainable matching.
                await p.locator('[data-view="eligibility"]').click();
                await p.locator('[name="major"]').fill('Computer Science');
                await p.locator('[name="nationality"]').fill('Indian');
                await p.locator('[name="education"]').selectOption({label:'High school completed'});
                await p.locator('[name="gradingScale"]').selectOption('100');
                await p.locator('[name="gpa"]').fill('93');
                await p.locator('[name="topik"]').selectOption('4');
                await p.locator('[name="ielts"]').fill('7.5');
                await p.locator('[name="intake"]').fill('Fall 2027');
                await p.locator('#profile-form button[type="submit"]').click();
                if(await p.locator('.match-card').count()!==15)throw Error('eligibility match results missing');
                const pct=parseInt((await p.locator('#profile-complete').innerText()).replace('%',''),10);
                if(!(pct>=80))throw Error('profile completeness did not update');
                if(await p.locator('#gap-results article').count()<1)throw Error('gap analyzer missing');
                // Real browser-local document vault.
                await p.locator('#vault-form input[type="file"]').setInputFiles({name:'transcript.pdf',mimeType:'application/pdf',buffer:Buffer.from('%PDF-1.4 preview transcript')});
                await p.locator('#vault-form [name="type"]').selectOption('transcript');
                await p.locator('#vault-form button[type="submit"]').click();
                await p.waitForTimeout(1200);
                const vaultDiag=await p.evaluate(()=>new Promise(resolve=>{
                  const req=indexedDB.open('kmate-scholarship-vault-preview',1);
                  req.onsuccess=()=>{const db=req.result;const tx=db.transaction('files','readonly');const countReq=tx.objectStore('files').count();countReq.onsuccess=()=>resolve({count:countReq.result,html:document.querySelector('#vault-files')?.innerHTML||''});countReq.onerror=()=>resolve({count:-1,error:String(countReq.error),html:document.querySelector('#vault-files')?.innerHTML||''})};
                  req.onerror=()=>resolve({count:-1,error:String(req.error),html:document.querySelector('#vault-files')?.innerHTML||''});
                }));
                console.log('VAULT_DIAG '+JSON.stringify({vaultDiag,errors}));
                if(errors.length)throw Error('vault page errors: '+errors.join(' | '));
                if(vaultDiag.count!==1||await p.locator('#vault-files article').count()!==1)throw Error('vault persistence/render failed: '+JSON.stringify(vaultDiag));
                if((await p.locator('#vault-count').innerText()).trim()!=='1')throw Error('vault file count failed');
                if(await p.locator('.compat-table .ready').count()<1)throw Error('document compatibility did not react to vault file');
                await p.screenshot({path:'eligibility.png',fullPage:true,animations:'disabled'});

                // Radar, saved-search watch, Cycle Watch and assistant.
                await p.locator('[data-view="discover"]').click();
                if(await p.locator('.radar-hit').count()<1)throw Error('personalized radar missing after profile');
                await p.locator('#save-search-watch').click();
                if(await p.locator('#saved-watches>div').count()!==1)throw Error('saved search watch failed');
                await p.locator('[data-cycle-watch]').first().click();
                if(await p.locator('[data-cycle-watch].active').count()!==1)throw Error('Cycle Watch failed');
                await p.locator('#notification-button').click();
                if(await p.locator('#notification-list .notice-item').count()<2)throw Error('notification center did not receive watch alerts');
                await p.locator('#close-notifications').click();
                await p.locator('#assistant-button').click();
                await p.locator('#assistant-question').fill('What funding does this scholarship provide?');
                await p.locator('#assistant-ask').click();
                if(await p.locator('#assistant-answer a').count()!==1)throw Error('scholarship assistant source grounding missing');
                await p.locator('#assistant-dialog').evaluate(el=>el.close());

                // Track + compare from Discover.
                const firstExpand=p.locator('[data-expand]').first();
                await firstExpand.click();
                const firstAward=firstExpand.locator('xpath=ancestor::article[contains(@class,"award")]');
                await firstAward.locator('[data-track]').click();
                await firstAward.locator('[data-compare]').click();
                if((await p.locator('#app-nav-count').innerText()).trim()!=='1')throw Error('tracked nav count failed');
                if((await p.locator('#compare-nav-count').innerText()).trim()!=='1')throw Error('compare nav count failed');
                if(await p.locator('#compare-tray:not([hidden])').count()!==1)throw Error('compare tray missing');

                // Applications workspace persistence.
                await p.locator('[data-view="applications"]').click();
                if(await p.locator('.application-card').count()!==1)throw Error('application workspace missing');
                await p.locator('[data-doc]').first().check();
                await p.locator('[data-app-field="stage"]').selectOption({label:'Preparing documents'});
                await p.locator('[data-notes]').fill('Need to verify the intake-specific document list.');
                await p.locator('[data-target-date]').fill('2026-11-15');
                if(!(await p.locator('[data-doc]').first().isChecked()))throw Error('document checkbox failed');
                if(await p.locator('.pathway-list article').count()<5)throw Error('automatic application pathway missing');
                // Peer review request + KMate handoffs.
                if(await p.locator('.handoff-row a').count()<2)throw Error('KMate writing/interview handoffs missing');
                await p.locator('[data-review-for]').click();
                await p.locator('#review-form [name="focus"]').fill('Check evidence alignment.');
                await p.locator('#review-form button[value="default"]').click();
                if(await p.locator('.review-requests article').count()!==1)throw Error('peer review request failed');
                const workspaceDownload=p.waitForEvent('download');
                await p.locator('#export-workspace').click();
                const ws=await workspaceDownload;
                if(!(await ws.suggestedFilename()).endsWith('.json'))throw Error('workspace export failed');
                // Calendar export.
                const calendarDownload=p.waitForEvent('download');
                await p.locator('#export-calendar').click();
                const cal=await calendarDownload;
                if(!(await cal.suggestedFilename()).endsWith('.ics'))throw Error('calendar export failed');

                // Reminder + timeline.
                await p.locator('[data-reminder-for]').click();
                await p.locator('#reminder-form [name="label"]').fill('Request transcript');
                await p.locator('#reminder-form [name="date"]').fill('2026-10-10');
                await p.locator('#save-reminder').click();
                if(await p.locator('.timeline-item').count()!==1)throw Error('reminder timeline failed');
                await p.locator('#add-reminder').click();
                await p.locator('#reminder-form [name="label"]').fill('Review application');
                await p.locator('#reminder-form [name="date"]').fill('2026-10-12');
                await p.locator('#save-reminder').click();
                if(await p.locator('.timeline-item.collision').count()<2)throw Error('deadline collision detection failed');
                await p.screenshot({path:'applications.png',fullPage:true,animations:'disabled'});

                // Compare.
                await p.locator('[data-view="compare"]').click();
                if(await p.locator('.compare-table').count()!==1)throw Error('comparison table missing');
                if(await p.locator('.source-history article').count()<1)throw Error('source history missing');
                if(await p.locator('.funding-results article').count()<1)throw Error('funding calculator results missing');
                await p.locator('#calc-living').fill('1200000');
                if(await p.locator('.funding-results .gap').count()<1)throw Error('funding calculator did not recalculate');
                await p.locator('#refresh-source-health').click();
                if((await p.locator('.history-state').first().innerText()).indexOf('snapshot')<0)throw Error('source snapshot audit failed');
                await p.screenshot({path:'compare.png',fullPage:true,animations:'disabled'});

                // Persistence after reload.
                await p.reload({waitUntil:'networkidle'});
                await p.locator('[data-view="applications"]').click();
                if(await p.locator('.application-card').count()!==1)throw Error('tracked workspace did not persist');
                if(!(await p.locator('[data-doc]').first().isChecked()))throw Error('document state did not persist');
                if((await p.locator('[data-notes]').inputValue()).indexOf('intake-specific')<0)throw Error('notes did not persist');
                if((await p.locator('[data-target-date]').inputValue())!=='2026-11-15')throw Error('target date did not persist');
                if(await p.locator('.review-requests article').count()!==1)throw Error('review request did not persist');
                await p.locator('[data-view="eligibility"]').click();
                await p.waitForFunction(()=>document.querySelectorAll('#vault-files article').length===1);
                if(await p.locator('#vault-files article').count()!==1)throw Error('IndexedDB vault did not persist');
              } else {
                const navHeight=await p.locator('.subnav button').first().evaluate(el=>el.getBoundingClientRect().height);
                if(navHeight<44)throw Error('mobile Studio nav target below 44px');
                await p.locator('[data-view="eligibility"]').click();
                const font=await p.locator('.form-grid input').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize));
                if(font<16)throw Error('mobile form input below 16px');
                await p.locator('[data-view="discover"]').click();
                await p.screenshot({path:'mobile.png',fullPage:true,animations:'disabled'});
              }
              await p.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmate-scholarship-studio-preview-qa
          path: |
            eligibility.png
            applications.png
            compare.png
            mobile.png
          retention-days: 3
          if-no-files-found: error
