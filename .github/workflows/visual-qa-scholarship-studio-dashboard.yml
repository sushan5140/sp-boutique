name: Visual QA Scholarship Studio Dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-qa-scholarship-studio-dashboard.yml'
      - 'scholarship-studio-dashboard/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          npm install --no-save --no-package-lock --no-audit playwright@1.56.1
          npx playwright install chromium
      - name: Responsive dashboard and workflow smoke test
        shell: bash
        run: |
          set -euo pipefail
          node --check scholarship-studio-dashboard/app.js
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-dashboard.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [width,height,label] of [[1440,900,'desktop'],[800,980,'tablet'],[390,844,'mobile']]){
              const p=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              await p.goto('http://127.0.0.1:8765/scholarship-studio-dashboard/',{waitUntil:'networkidle'});
              if(await p.locator('.dash-hero').count()!==1)throw Error(label+' dashboard hero absent');
              if(await p.locator('.dash-award').count()!==3)throw Error(label+' spotlight absent');
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth);
              await p.screenshot({path:label+'.png',fullPage:true,animations:'disabled'});
              console.log(JSON.stringify({label,overflow,errors,awards:await p.locator('.dash-award').count()}));
              if(overflow||errors.length)throw Error('Failed '+label);
              if(label==='desktop'){
                await p.locator('#load-demo').click();
                if(await p.locator('.dash-list-row').count()<2)throw Error('demo application state absent');
                if(await p.locator('.dash-stat').nth(1).locator('.dash-stat-number').textContent()!=='2')throw Error('demo application count incorrect');
                await p.screenshot({path:'example-workspace.png',fullPage:true,animations:'disabled'});
                await p.locator('[data-view="discover"]').first().click();
                if(await p.locator('.scholarship-card').count()!==15)throw Error('catalog changed');
                await p.locator('[data-view="applications"]').first().click();
                if(await p.locator('.app-card').count()!==2)throw Error('tracking data lost');
                await p.screenshot({path:'applications.png',fullPage:true,animations:'disabled'});
                await p.locator('[data-view="compare"]').first().click();
                if(await p.locator('.compare-table').count()!==1)throw Error('comparison absent');
                await p.screenshot({path:'compare.png',fullPage:true,animations:'disabled'});
                await p.reload({waitUntil:'networkidle'});
                if(await p.locator('.compare-table').count()!==1)throw Error('demo workspace not persisted');
              }
              await p.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarship-studio-dashboard-visual-qa
          path: |
            desktop.png
            tablet.png
            mobile.png
            example-workspace.png
            applications.png
            compare.png
          retention-days: 4
          if-no-files-found: error
