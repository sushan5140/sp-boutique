name: Visual QA Scholarship Studio V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-qa-scholarship-studio-v2.yml'
      - 'scholarship-studio-v2/**'
      - 'scholarship-studio-v3/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          npm install --no-save --no-package-lock --no-audit playwright@1.56.1
          npx playwright install chromium
      - name: Render and exercise Signal Edition
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-v2.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({headless: true});
            const url = 'http://127.0.0.1:8765/scholarship-studio-v2/';
            for(const [width,height,label] of [[1440,900,'desktop-v2'],[390,844,'mobile-v2'],[800,980,'tablet-v2']]){
              const p=await b.newPage({viewport:{width,height},deviceScaleFactor:1});
              const errors=[];
              p.on('pageerror',err=>errors.push(err.message));
              await p.goto(url,{waitUntil:'networkidle'});
              if(await p.locator('.nuri-hero').count()!==1)throw Error(label+' Nuri hero missing');
              if(await p.locator('.nuri-desk-card').count()!==1)throw Error(label+' scholarship desk missing');
              if(await p.locator('.nuri-role-row').count()!==1)throw Error(label+' role row missing');
              if(await p.locator('.nuri-role-card').count()!==4)throw Error(label+' interactive role cards missing');
              if(await p.locator('.nuri-metrics>button').count()!==4)throw Error(label+' interactive hero metrics missing');
              if(await p.locator('.desk-universities-grid button').count()!==4)throw Error(label+' live university desk missing');
              if(await p.locator('.discovery-search-label').count()!==1)throw Error(label+' finder search missing');
              if((await p.locator('.edition-badge').innerText()).trim()!=='V2 · SIGNAL')throw Error(label+' Signal Edition badge missing');
              const count=await p.locator('.scholarship-card').count();
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth);
              const signal=await p.locator('body').evaluate(el=>getComputedStyle(el).getPropertyValue('--signal').trim());
              console.log(JSON.stringify({label,count,overflow,errors,signal}));
              if(count!==15 || overflow || errors.length)throw Error('Failed '+label);
              if(signal!=='#f2d64b')throw Error('Signal yellow token missing: '+signal);
              const firstPeek=p.locator('[data-expand]').first();
              if(await firstPeek.count()!==1)throw Error('quick look trigger missing');
              await firstPeek.click();
              if((await firstPeek.getAttribute('aria-expanded'))!=='true')throw Error('quick look did not expand');
              const expandedCard=firstPeek.locator('xpath=ancestor::article[contains(@class,"scholarship-card")]');
              if(!(await expandedCard.evaluate(el=>el.classList.contains('is-expanded'))))throw Error('expanded card state missing');
              if(await expandedCard.locator('.card-detail-grid').count()!==1)throw Error('quick look details missing');
              await firstPeek.click();
              if(label==='mobile-v2'){
                const nav=await p.locator('.nav-item').first().evaluate(el=>el.getBoundingClientRect().height);
                const inputSize=await p.locator('.input').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize));
                const sidebarPosition=await p.locator('.sidebar').evaluate(el=>getComputedStyle(el).position);
                if(nav<44)throw Error('mobile nav target below 44px: '+nav);
                if(inputSize<16)throw Error('mobile input font below 16px: '+inputSize);
                if(sidebarPosition!=='fixed')throw Error('mobile bottom nav not fixed');
              }
              await p.screenshot({path:label+'.png',fullPage:true,animations:'disabled'});
              await p.locator('.university-pill[data-uni-quick="KAIST"]').click();
              if(await p.locator('.scholarship-card').count()!==1)throw Error('University quick filter failed');
              await p.locator('.university-pill[data-uni-quick="all"]').click();
              if(await p.locator('.scholarship-card').count()!==15)throw Error('All universities quick filter failed');
              if(label==='desktop-v2'){
                await p.locator('[data-view="eligibility"]').first().click();
                if(await p.locator('.page-mast-eligibility').count()!==1)throw Error('eligibility masthead missing');
                await p.screenshot({path:'eligibility-v2.png',fullPage:true,animations:'disabled'});
                await p.locator('#profile-form button[type=submit]').click();
                await p.locator('[data-view="discover"]').first().click();
                await p.locator('[data-compare]').first().click();
                if(await p.locator('.selection-tray').count()!==1)throw Error('comparison tray did not appear');
                await p.locator('.selection-tray [data-compare]').first().click();
                if(await p.locator('.selection-tray').count()!==0)throw Error('comparison tray did not clear');
                await p.locator('[data-track]').first().click();
                await p.locator('[data-view="applications"]').first().click();
                if(await p.locator('.app-card').count()!==1)throw Error('application tracking failed');
                if(await p.locator('.page-mast-applications').count()!==1)throw Error('application masthead missing');
                await p.screenshot({path:'applications-v2.png',fullPage:true,animations:'disabled'});
                await p.locator('[data-view="compare"]').first().click();
                await p.locator('input[data-compare]').first().check();
                if(await p.locator('.compare-table').count()!==1)throw Error('comparison failed');
                if(await p.locator('.page-mast-compare').count()!==1)throw Error('comparison masthead missing');
                if(await p.locator('.compare-slot').count()!==3)throw Error('comparison slots absent');
                await p.screenshot({path:'compare-v2.png',fullPage:true,animations:'disabled'});
              }
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarship-studio-v2-signal-visual-qa
          path: |
            desktop-v2.png
            mobile-v2.png
            tablet-v2.png
            eligibility-v2.png
            applications-v2.png
            compare-v2.png
          retention-days: 3
          if-no-files-found: error
